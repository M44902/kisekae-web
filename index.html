<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <title>Kisekae Web Emulator - Fully Featured</title>
    <link rel='stylesheet' href='boxedwine.css'>
    <style>
        body { background-color: #1a1a1a; color: #f0f0f0; font-family: sans-serif; text-align: center; padding: 20px; }
        #canvas { background-color: #000; border: 2px solid #555; display: block; margin: 20px auto; max-width: 95vw; }
        #output { width: 80%; height: 150px; margin: 10px auto; background-color: #000; color: #0f0; font-family: monospace; padding: 10px; overflow-y: scroll; text-align: left; display: none; }
        .controls { margin: 10px; }
        #spinner { display: inline-block; width: 50px; height: 50px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Kisekae Web Application</h1>

    <div id='loadStatus'>
        <div id='status'>Loading WebAssembly...</div>
        <progress id='progress' value='0' max='100' style='width: 300px;'></progress>
        <div id='spinner'></div>
    </div>

    <canvas id='canvas' oncontextmenu='event.preventDefault()'></canvas>

    <div class='controls'>
        <button id='startbtn'>Start Emulator</button>
        <button id='uploadbtn' class='hidden'>Upload File</button>
        <button id='downloadbtn' class='hidden'>Download File</button>
        <label id='sound-checkbox'><input type='checkbox' id='soundToggle' checked> Enable Sound</label>
        <button id='showConsole'>Toggle Console</button>
    </div>

    <div id='dropzone' style='border: 2px dashed #444; padding: 10px; margin: 10px auto; width: 80%;'>Drop files here to upload to virtual drive</div>
    
    <div id='items' class='hidden'></div>
    <div id='tree' class='hidden'></div>
    <div id='message'></div>
    <div id='selectedItem' class='hidden'></div>

    <!-- Hidden Modal Triggers for shell scripts -->
    <a id='modalLink' class='hidden'></a>
    <a id='modalLinkExe' class='hidden'></a>
    <button id='openModalExeClick' class='hidden'></button>

    <textarea id='output' rows='8'></textarea>

    <script type='text/javascript'>
        var Module = {
            canvas: document.getElementById('canvas'),
            arguments: ['-root', '/kisekae.zip'],
            print: function(text) { console.log(text); if (document.getElementById('output')) document.getElementById('output').value += text + '\n'; },
            printErr: function(text) { console.error(text); if (document.getElementById('output')) document.getElementById('output').value += 'Error: ' + text + '\n'; },
            onRuntimeInitialized: function() {
                console.log('Boxedwine Runtime Initialized');
                document.getElementById('status').innerHTML = 'Ready';
            }
        };
    </script>

    <!-- Load scripts at the end -->
    <script async type='text/javascript' src='boxedwine.js'></script>
    <script async type='text/javascript' src='boxedwine-shell.js'></script>
</body>
</html>
